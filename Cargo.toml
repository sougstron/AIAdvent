[package]
name = "ask"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.6", features = ["derive", "env"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
# default features drag in reqwest+tokio+aws-lc-sys for remote $ref resolution;
# our schemas are local, so validation-only is enough.
jsonschema = { version = "0.52.1", default-features = false }
chrono = "0.4.45"

[profile.release]
strip = true
