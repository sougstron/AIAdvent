name: ask-home-engine
services:
  ollama:
    image: ollama/ollama:0.13.5
    user: "1000:1000"
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_LLM_LIBRARY: cpu
      CUDA_VISIBLE_DEVICES: "-1"
      ROCR_VISIBLE_DEVICES: "-1"
    volumes:
      - ./models:/models
    networks: [backend]
    mem_limit: 3840m
    memswap_limit: 3840m
    cpus: 3.70
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=134217728,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
  gateway:
    image: python:3.13-slim-bookworm
    user: "65534:65534"
    command: [python, -B, /app/gateway.py]
    env_file: [./secrets.env]
    volumes:
      - ./gateway.py:/app/gateway.py:ro
    ports:
      - "192.168.0.128:11435:8080"
    networks: [backend, lan]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=16777216,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      ollama: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8080/v1/models',headers={'Authorization':'Bearer '+os.environ['LLM_KEY']}); urllib.request.urlopen(r,timeout=3).close()"
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
networks:
  backend:
    internal: true
  lan: {}
