<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Ladder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>Model Ladder</h1>
      <p class="sub">Один запрос уходит на три модели — меняется только <code>модель</code>.</p>
    </div>
    <div class="models" id="tier-pills">
      <span id="verdict" class="pill verdict hidden"></span>
    </div>
  </header>

  <div id="check" class="check hidden"></div>

  <section class="composer">
    <textarea id="prompt" rows="3" placeholder="Что спросить у трёх моделей?" spellcheck="false"></textarea>
    <div class="composer-row">
      <div class="presets" id="presets"></div>
      <div class="controls">
        <button id="verify" class="ghost">Проверить лестницу</button>
        <button id="go" class="go">Сравнить</button>
      </div>
    </div>
  </section>

  <div id="status" class="status hidden"></div>

  <main id="results" class="results hidden">
    <div class="cards" id="cards"></div>

    <section class="summary card">
      <div class="summary-head">
        <h2>Разбор от <span id="judge-name"></span> <span class="blind">вслепую</span></h2>
        <div class="summary-actions">
          <span id="timing" class="muted"></span>
          <button id="copy" class="ghost">Скопировать отчёт</button>
        </div>
      </div>
      <div id="summary" class="md"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
