[package]
name = "ask"
version = "0.3.0"
edition = "2021"
description = "Model Ladder — один запрос на слабой, средней и сильной модели: время, токены, стоимость"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true

# standalone snapshot: empty [workspace] detaches this copy from the repo-root workspace
[workspace]
