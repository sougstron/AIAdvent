[package]
name = "ask"
version = "0.2.0"
edition = "2021"
description = "Temperature Lab — сравнение ответов LLM при temperature 0 / 0.7 / 1.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true

# standalone snapshot: empty [workspace] detaches this copy from the repo-root workspace
[workspace]
